# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: pytest

on:
  # Only run on pull requests targeting main. A pull_request run tests the result of
  # merging the branch into main, so a push trigger on main would just repeat it.
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened"]
  # Manual run, for checking a branch before opening a pull request for it
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    # The suite takes about five minutes locally. Anything near this is a hang, and
    # without a cap the run would sit on a runner for the default six hours.
    timeout-minutes: 30
    strategy:
      matrix:
        platform: ["ubuntu-latest"]
        # The ends of the supported range: the floor in requires-python, and the newest release.
        python-version: ["3.11", "3.14"]

    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install
    - name: Install the project
      run: uv sync --all-extras --dev #--index torch=https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
    - name: Install pip for spaCy
      run: uv pip install pip
    - name: Download spaCy model
      run: uv run -- spacy download en_core_web_sm
    - name: Lint with ruff
      run: uv run ruff check entity_linkings
    - name: Test with pytest
      run: uv run pytest -v
